version: "3.9"

services:
  api:
    build: .
    container_name: saas_api
    ports:
      - "4000:4000"
    env_file:
     - .env
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: saas_postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: saas_user
      POSTGRES_PASSWORD: saas_pass
      POSTGRES_DB: saas_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data: